user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"x_request_id":"$request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ───────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 10s;
    server_tokens off;

    # ── Compression ───────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ── Buffer sizes ──────────────────────────────────────────
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    proxy_buffer_size 16k;
    proxy_buffers 32 16k;
    proxy_busy_buffers_size 64k;

    # ── Rate limiting zones ───────────────────────────────────
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=api:10m      rate=200r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m     rate=10r/m;
    limit_req_zone $binary_remote_addr zone=scan:10m     rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── SSL/TLS ───────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    # Docker services are recreated during rebuilds and can receive new IPs.
    # Use Docker DNS with short TTL so Nginx does not keep stale upstream IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ── Security headers map ──────────────────────────────────
    map $sent_http_content_type $csp_header {
        default "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss:; frame-ancestors 'none';";
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS server ─────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        set $api_upstream http://api:8000;
        set $frontend_upstream http://frontend:3000;

        # Connection limits
        limit_conn conn_limit 50;

        # ── Security headers ──────────────────────────────────
        add_header X-Frame-Options            "DENY"                            always;
        add_header X-Content-Type-Options     "nosniff"                         always;
        add_header X-XSS-Protection           "1; mode=block"                   always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Request-ID               $request_id                       always;
        add_header Content-Security-Policy    $csp_header                       always;

        # Hide server info
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        # ── Auth endpoints (strict rate limit) ────────────────
        location /api/v1/auth/login {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            proxy_pass $api_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        location /api/v1/auth/register {
            limit_req zone=auth burst=3 nodelay;
            limit_req_status 429;
            proxy_pass $api_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Scan endpoints (moderate rate limit) ──────────────
        location ~ ^/api/v1/organizations/[^/]+/scans$ {
            limit_req zone=scan burst=5 nodelay;
            limit_req_status 429;
            proxy_pass $api_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── API proxy ─────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;

            proxy_pass $api_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;

            # API-specific headers
            proxy_set_header Accept-Encoding "";

            # CORS preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  '$http_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Request-ID, X-API-Key' always;
                add_header 'Access-Control-Max-Age'       1728000;
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # ── WebSocket ─────────────────────────────────────────
        location = /ws {
            proxy_pass $api_upstream/api/v1/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /ws/ {
            proxy_pass $api_upstream/api/v1/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── MinIO / Object storage ────────────────────────────
        location ^~ /storage/ {
            proxy_pass http://minio:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            client_max_body_size 100m;
        }

        # ── Health check (no rate limit) ──────────────────────
        location /health {
            proxy_pass $api_upstream/health;
            include /etc/nginx/conf.d/proxy_params.conf;
            access_log off;
        }

        # ── Prometheus metrics (internal only) ────────────────
        location /metrics {
            allow 172.16.0.0/12;  # Docker internal
            allow 10.0.0.0/8;
            deny all;
            proxy_pass $api_upstream/metrics;
            access_log off;
        }

        # ── Grafana (own login screen enforces access) ───────
        # No trailing slash on proxy_pass here, deliberately: Grafana is
        # running with GF_SERVER_SERVE_FROM_SUB_PATH=true, which makes it
        # expect the /grafana/ prefix to still be present on the incoming
        # request path. A trailing-slash proxy_pass strips that prefix
        # before forwarding, and Grafana would redirect right back to
        # /grafana/ to "correct" it -- an infinite redirect loop.
        # `^~` is required too: without it, the regex static-asset location
        # below (~* \.(js|css|...)$) wins over this plain prefix location for
        # any Grafana .js/.css request and sends it to the frontend upstream
        # instead -- Grafana's own JS bundle 404s and it shows a blank/broken
        # "failed to load application files" page.
        location ^~ /grafana/ {
            proxy_pass http://grafana:3000;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Prometheus UI/API (Basic Auth -- Prometheus has no login
        #    of its own, unlike Grafana above) ───────────────────
        # `^~` for the same reason as /grafana/ above: without it, Prometheus's
        # own .js/.css bundle requests get hijacked by the regex static-asset
        # location and sent to the frontend upstream instead, leaving the UI
        # blank.
        location ^~ /prometheus/ {
            auth_basic           "Prometheus";
            auth_basic_user_file /etc/nginx/conf.d/.htpasswd;
            proxy_pass http://prometheus:9090/;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Frontend (Next.js) ────────────────────────────────
        location / {
            limit_req zone=global burst=100 nodelay;

            proxy_pass $frontend_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;

            # Next.js SPA support
            proxy_intercept_errors on;
            error_page 404 = @fallback;
        }

        location @fallback {
            proxy_pass $frontend_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
        }

        # ── Static assets (long cache) ────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            proxy_pass $frontend_upstream;
            include /etc/nginx/conf.d/proxy_params.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Block sensitive paths ─────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ^/(\.git|\.env|wp-admin|phpmyadmin|adminer) {
            deny all;
            return 404;
        }
    }
}
