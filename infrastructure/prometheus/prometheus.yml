global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: "asm-platform"
    environment: "production"

# Alert rules (inline)
rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # ── Prometheus self-monitoring ────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── ASM API ───────────────────────────────────────────────
  - job_name: "asm-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "asm-api"

  # ── ASM Workers ───────────────────────────────────────────
  # `scheduler` deliberately excluded: ScanScheduler doesn't subclass
  # BaseWorker, so it never calls start_http_server() and has no /metrics.
  - job_name: "asm-workers"
    static_configs:
      - targets:
          - "worker-discovery:8001"
          - "worker-port:8001"
          - "worker-crawl:8001"
          - "worker-enrichment:8001"
          - "worker-nuclei:8001"
          - "worker-screenshot:8001"
          - "worker-correlation:8001"
          - "worker-risk:8001"
          - "worker-notification:8001"
    metrics_path: "/metrics"
    scrape_interval: 15s

  # ── RabbitMQ ──────────────────────────────────────────────
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
    scrape_interval: 15s
    metric_relabel_configs:
      # erlang_vm_allocators alone is 900+ series of BEAM VM internals
      # nothing here dashboards or alerts on -- dropped to stop it from
      # dominating TSDB storage under the 30d retention window.
      - source_labels: [__name__]
        regex: "erlang_vm_allocators.*"
        action: drop

  # ── Postgres / Redis / NGINX / host metrics ──────────────
  # No postgres-exporter / redis-exporter / nginx-exporter / node-exporter
  # container exists in docker-compose.yml -- these were scrape targets
  # for exporters that were never actually deployed. Re-add a job here
  # if/when the matching exporter container is added for real.

  # ── MinIO ─────────────────────────────────────────────────
  # minio:9000/minio/v2/metrics/cluster requires an authenticated Prometheus
  # bearer token (MinIO admin API) that was never configured -- scraping it
  # unauthenticated always 403s. Re-add once MINIO_PROMETHEUS_AUTH_TYPE /
  # a scrape bearer_token_file is actually wired up.
