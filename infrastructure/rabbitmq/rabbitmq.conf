# RabbitMQ main configuration
# Optimized for ASM Platform scanning workloads

# ── Networking ────────────────────────────────────────────────
listeners.tcp.default = 5672
management.tcp.port = 15672
prometheus.tcp.port = 15692
# Per-object metrics (per-queue depth, labeled by `queue`/`vhost`) are off by
# default -- without this, rabbitmq_queue_messages has no labels at all, just
# one cluster-wide aggregate. ~24 queues total, so the added cardinality is
# small. Needed for Grafana's "RabbitMQ Queue Depth" panel to show anything
# per-queue instead of nothing.
prometheus.return_per_object_metrics = true

# ── Credentials ───────────────────────────────────────────────
# Set via environment variables: RABBITMQ_DEFAULT_USER, RABBITMQ_DEFAULT_PASS

# ── Limits ────────────────────────────────────────────────────
# Max message size: 128MB (for large scan result payloads)
max_message_size = 134217728

# ── Memory ────────────────────────────────────────────────────
vm_memory_high_watermark.relative = 0.7
vm_memory_high_watermark_paging_ratio = 0.75
disk_free_limit.absolute = 2GB

# ── Queue defaults ────────────────────────────────────────────
# Default message TTL: 24 hours
# Queues define their own via x-message-ttl argument

# ── Connection tuning ─────────────────────────────────────────
heartbeat = 60
channel_max = 0
connection_max = 1000

# consumer_timeout (ms): RabbitMQ 3.8.15+ force-closes a channel (PRECONDITION_
# FAILED) if a delivered message isn't ack'd within this window, and redelivers
# it -- server default is 30 minutes. A single bounty.recon or bounty.exploit
# message does its *entire* stage (every seed domain, or every module across
# every candidate URL) in one message/one ack, and a real, sometimes-slow/WAF-
# throttled external target can regularly exceed even a generous bound for the
# whole batch. Confirmed live twice against the same real 10-domain program:
# first at the 30-minute default (recon redelivered every ~30-45 minutes,
# reprocessed from scratch each time, never reaching one clean completion) and
# again after raising this to 3 hours (10800000) -- a heavily WAF-throttled
# exploit run (14 modules, most candidate URLs individually bounded by
# RUN_MODULE_URL_TIMEOUT but still adding up across the whole stage) legitimately
# took 4h19m (`bounty_exploit_completed` logged findings=8 the same instant
# `message_channel_closed elapsed_s=15563.5` fired) -- the ack lost the race
# against the channel closing, so the message redelivered and re-ran the
# *entire already-completed* stage from scratch, duplicating hours of real
# traffic against the actual target for zero additional value. 8 hours gives
# ~2x headroom above that observed worst case.
consumer_timeout = 28800000

# ── Logging ───────────────────────────────────────────────────
log.console = true
log.console.level = warning
log.file = false

# ── Plugins ───────────────────────────────────────────────────
# Enabled in Dockerfile: rabbitmq-plugins enable rabbitmq_management rabbitmq_prometheus

# ── Definitions file (loaded at startup) ─────────────────────
# NOTE: Disabled because base_worker.py & queue_client.py declare
# all topology at runtime. Keeping definitions.json for reference.
# load_definitions = /etc/rabbitmq/definitions.json
