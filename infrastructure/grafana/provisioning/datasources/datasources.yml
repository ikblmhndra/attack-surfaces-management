apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    uid: prometheus-asm
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: GET

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: asmdb
    user: ${GF_DATASOURCE_PG_USER}
    secureJsonData:
      password: ${GF_DATASOURCE_PG_PASSWORD}
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      postgresVersion: 1600
      timescaledb: false
