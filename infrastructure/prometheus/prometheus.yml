global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: "asm-platform"
    environment: "production"

# Alert rules (inline)
rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # ── Prometheus self-monitoring ────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── ASM API ───────────────────────────────────────────────
  - job_name: "asm-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "asm-api"

  # ── ASM Workers ───────────────────────────────────────────
  - job_name: "asm-workers"
    static_configs:
      - targets:
          - "worker-discovery:8001"

          - "worker-nuclei:8001"
          - "worker-screenshot:8001"
          - "worker-correlation:8001"
          - "worker-risk:8001"
          - "worker-notification:8001"
          - "scheduler:8001"
    metrics_path: "/metrics"
    scrape_interval: 15s

  # ── PostgreSQL ────────────────────────────────────────────
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 30s

  # ── Redis ─────────────────────────────────────────────────
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 15s

  # ── RabbitMQ ──────────────────────────────────────────────
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
    scrape_interval: 15s

  # ── NGINX ─────────────────────────────────────────────────
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
    scrape_interval: 15s

  # ── Node / host metrics ───────────────────────────────────
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 15s

  # ── MinIO ─────────────────────────────────────────────────
  - job_name: "minio"
    metrics_path: "/minio/v2/metrics/cluster"
    static_configs:
      - targets: ["minio:9000"]
    scrape_interval: 30s
