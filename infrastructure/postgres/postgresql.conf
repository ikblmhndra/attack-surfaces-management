# ASM Platform — PostgreSQL Performance Configuration
# Tuned for 8GB RAM, SSD storage, mixed read/write workload

# ── Connection Settings ───────────────────────────────────────
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 3

# ── Memory Settings ───────────────────────────────────────────
shared_buffers = 2GB              # 25% of RAM
effective_cache_size = 6GB        # 75% of RAM
work_mem = 32MB                   # Per sort/hash operation
maintenance_work_mem = 512MB      # For VACUUM, CREATE INDEX
wal_buffers = 64MB
temp_buffers = 32MB

# ── Checkpoint Settings ───────────────────────────────────────
checkpoint_completion_target = 0.9
wal_level = replica
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min

# ── Planner Settings ──────────────────────────────────────────
random_page_cost = 1.1            # SSD (vs 4.0 for HDD)
effective_io_concurrency = 200    # SSD concurrent I/O
seq_page_cost = 1.0

# ── Parallelism ───────────────────────────────────────────────
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000

# ── JSONB / GIN optimization ──────────────────────────────────
gin_pending_list_limit = 64MB

# ── Write Performance ─────────────────────────────────────────
synchronous_commit = off          # Async writes (safe for this use case)
wal_compression = on
wal_writer_delay = 200ms
commit_delay = 0

# ── Autovacuum Tuning ─────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.02
autovacuum_analyze_scale_factor = 0.01
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 400

# ── Logging ───────────────────────────────────────────────────
log_destination = 'stderr'
logging_collector = off           # Let Docker handle logs
log_min_messages = WARNING
log_min_error_statement = ERROR
log_min_duration_statement = 1000 # Log queries > 1 second
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 100MB
log_autovacuum_min_duration = 1000
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# ── Statistics ────────────────────────────────────────────────
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# ── Lock Management ───────────────────────────────────────────
deadlock_timeout = 1s
lock_timeout = 10s
idle_in_transaction_session_timeout = 60s
statement_timeout = 300s          # 5 min max query time

# ── Connection Pooling Compatibility ─────────────────────────
# For PgBouncer compatibility
tcp_keepalives_idle = 600
tcp_keepalives_interval = 30
tcp_keepalives_count = 10

# ── Locale ────────────────────────────────────────────────────
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
datestyle = 'iso, mdy'
